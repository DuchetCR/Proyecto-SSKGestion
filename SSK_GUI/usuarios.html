<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SSK Gestión — Usuarios</title>
    <link rel="stylesheet" href="css/ssk.css">
</head>
<body>

    <div id="sidebar-container"></div>

    <div class="main">
        <div class="topbar">
            <h2>Usuarios</h2>
            <div class="usuario-info">

                <div class="avatar">
                    CM
                </div>

                <div class="usuario-datos">
                    <span>
                        Carlos Mora — Gerente General
                    </span>

                    <a href="login.html" class="btn-cerrar-sesion">
                        <i class="fas fa-sign-out-alt"></i>
                        Cerrar sesión
                    </a>
                </div>

            </div>
        </div>

        <div class="content">

            <div class="barra-busqueda">
                <input id="buscarusuario" type="text" placeholder="Buscar usuario...">
                <button class="btn btn-primary" onclick="mostrarFormulario()"><i class="fas fa-plus"></i> Nuevo usuario</button>
            </div>

            <!-- Formulario nuevo usuario -->
            <div id="formulario" style="display:none; margin-bottom:24px;">
                <div class="form-card">
                    <h3>Nuevo usuario</h3>

                    <form id="formUsuario">
                        <div class="form-row">
                            <div class="form-group">
                                <label for="nombre">Nombre</label>

                                <input
                                    type="text"
                                    id="nombre"
                                    name="nombre"
                                    placeholder="Ej: Carlos"
                                    maxlength="100"
                                    required
                                >
                            </div>

                            <div class="form-group">
                                <label for="primerApellido">
                                    Primer apellido
                                </label>

                                <input
                                    type="text"
                                    id="primerApellido"
                                    name="primerApellido"
                                    placeholder="Ej: Mora"
                                    maxlength="100"
                                    required
                                >
                            </div>
                        </div>

                        <div class="form-row">
                            <div class="form-group">
                                <label for="segundoApellido">
                                    Segundo apellido
                                </label>

                                <input
                                    type="text"
                                    id="segundoApellido"
                                    name="segundoApellido"
                                    placeholder="Ej: Jiménez"
                                    maxlength="100"
                                >
                            </div>

                            <div class="form-group">
                                <label for="tipoUsuario">
                                    Tipo de usuario
                                </label>

                                <select
                                    id="tipoUsuario"
                                    name="tipoUsuario"
                                    required
                                >
                                    <option value="">
                                        Seleccione un tipo
                                    </option>

                                    <option value="1">
                                        Administrador
                                    </option>

                                    <option value="2">
                                        Cliente Cartera
                                    </option>

                                    <option value="3">
                                        Cliente Convencional
                                    </option>

                                    <option value="4">
                                        Empleado
                                    </option>
                                </select>
                            </div>
                        </div>

                        <div
                            class="form-row"
                            id="camposEmpleado"
                            style="display:none;"
                        >
                            <div class="form-group">
                                <label for="puesto">Puesto</label>

                                <select id="puesto" name="puesto">
                                    <option value="">
                                        Seleccione un puesto
                                    </option>

                                    <option value="1">
                                        Gerente General
                                    </option>

                                    <option value="2">
                                        Encargado de Facturación
                                    </option>

                                    <option value="3">
                                        Repartidor
                                    </option>

                                    <option value="4">
                                        Encargado de Pedidos
                                    </option>

                                    <option value="5">
                                        Asistente Administrativo
                                    </option>
                                </select>
                            </div>

                            <div class="form-group">
                                <label for="salario">
                                    Salario (₡)
                                </label>

                                <input
                                    type="number"
                                    id="salario"
                                    name="salario"
                                    placeholder="Ej: 650000"
                                    min="0"
                                    step="0.01"
                                >
                            </div>
                        </div>

                        <div class="form-row">
                            <div class="form-group">
                                <label for="correo">Correo</label>

                                <input
                                    type="email"
                                    id="correo"
                                    name="correo"
                                    placeholder="Ej: carlos.mora@ssk.cr"
                                    maxlength="200"
                                    required
                                >
                            </div>

                            <div class="form-group">
                                <label for="telefono">Teléfono</label>

                                <input
                                    type="text"
                                    id="telefono"
                                    name="telefono"
                                    placeholder="Ej: 88001100"
                                    maxlength="20"
                                    required
                                >
                            </div>
                        </div>

                        <div
                            id="mensajeUsuario"
                            style="
                                display:none;
                                margin-bottom:16px;
                                padding:12px;
                                border-radius:6px;
                            "
                        ></div>

                        <div class="form-actions">
                            <button
                                type="submit"
                                class="btn btn-primary"
                                id="btnGuardarUsuario"
                            >
                                <i class="fas fa-save"></i>
                                Guardar
                            </button>

                            <button
                                type="button"
                                class="btn btn-outline"
                                onclick="ocultarFormulario()"
                            >
                                Cancelar
                            </button>
                        </div>
                    </form>
                </div>
            </div>

            <!-- Tabla usuarios -->
            <div class="tabla-card">
                <div class="tabla-header">
                    <h3>Lista de usuarios</h3>
                </div>
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Nombre completo</th>
                            <th>Tipo</th>
                            <th>Puesto</th>
                            <th>Correo</th>
                            <th>Estado</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tablaUsuarios">
                        
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="js/sidebar.js"></script>

<script>
    document.getElementById(
        "sidebar-container"
    ).innerHTML = cargarSidebar("usuarios.html");

    function mostrarFormulario() {
        document.getElementById(
            "formulario"
        ).style.display = "block";
    }

    function ocultarFormulario() {
        document.getElementById(
            "formulario"
        ).style.display = "none";

        document.getElementById(
            "formUsuario"
        ).reset();

        document.getElementById(
            "camposEmpleado"
        ).style.display = "none";

        document.getElementById(
            "puesto"
        ).required = false;

        document.getElementById(
            "salario"
        ).required = false;

        document.getElementById(
            "mensajeUsuario"
        ).style.display = "none";
    }
</script>

<script src="js/usuarios.js"></script>

</body>
</html>

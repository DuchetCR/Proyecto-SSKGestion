<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        SSK Gestión — Productos
    </title>

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css"
    >

    <link
        rel="stylesheet"
        href="css/ssk.css"
    >
</head>

<body>

    <div id="sidebar-container"></div>


    <div class="main">

        <div class="topbar">

            <h2>
                Productos e Inventario
            </h2>

            <div class="usuario-info">

                <div class="avatar">
                    CM
                </div>

                <span>
                    Carlos Mora — Gerente General
                </span>

            </div>

        </div>


        <div class="content">

            <!-- Mensajes de éxito o error -->
            <div
                id="mensajeProducto"
                style="display: none;"
            ></div>


            <!-- Botón para abrir formulario -->
            <div class="barra-busqueda">

                <input
                    type="text"
                    placeholder="Buscar producto..."
                >

                <button
                    type="button"
                    class="btn btn-primary"
                    onclick="mostrarFormulario()"
                >
                    <i class="fas fa-plus"></i>
                    Nuevo producto
                </button>

            </div>


            <!-- Formulario -->
            <div
                id="formulario"
                style="
                    display: none;
                    margin-bottom: 24px;
                "
            >

                <div class="form-card">

                    <h3 id="tituloFormularioProducto">
                        Nuevo producto
                    </h3>


                    <form id="formProducto">

                        <div class="form-row">

                            <div class="form-group">

                                <label for="nombreProducto">
                                    Nombre del producto
                                </label>

                                <input
                                    id="nombreProducto"
                                    type="text"
                                    maxlength="100"
                                    required
                                    placeholder="Ej: Jabón líquido industrial 5L"
                                >

                            </div>


                            <div class="form-group">

                                <label for="precioProducto">
                                    Precio unitario (₡)
                                </label>

                                <input
                                    id="precioProducto"
                                    type="number"
                                    min="0"
                                    step="0.01"
                                    required
                                    placeholder="Ej: 8500"
                                >

                            </div>

                        </div>


                        <div class="form-row full">

                            <div class="form-group">

                                <label for="descripcionProducto">
                                    Descripción
                                </label>

                                <textarea
                                    id="descripcionProducto"
                                    rows="2"
                                    maxlength="255"
                                    required
                                    placeholder="Descripción del producto..."
                                ></textarea>

                            </div>

                        </div>


                        <div class="form-row">

                            <div class="form-group">

                                <label for="cantidadProducto">
                                    Cantidad en bodega
                                </label>

                                <input
                                    id="cantidadProducto"
                                    type="number"
                                    min="0"
                                    step="1"
                                    required
                                    placeholder="Ej: 100"
                                >

                            </div>


                            <div class="form-group">

                                <label for="estadoProducto">
                                    Estado
                                </label>

                                <select
                                    id="estadoProducto"
                                    required
                                >
                                    <option value="1">
                                        Activo
                                    </option>

                                    <option value="2">
                                        Inactivo
                                    </option>
                                </select>

                            </div>

                        </div>


                        <div class="form-actions">

                            <button
                                id="btnGuardarProducto"
                                type="submit"
                                class="btn btn-primary"
                            >
                                <i class="fas fa-save"></i>
                                Guardar
                            </button>


                            <button
                                type="button"
                                class="btn btn-outline"
                                onclick="ocultarFormulario()"
                            >
                                Cancelar
                            </button>

                        </div>

                    </form>

                </div>

            </div>


            <!-- Tabla de productos -->
            <div class="tabla-card">

                <div class="tabla-header">

                    <h3>
                        Catálogo de productos
                    </h3>

                </div>


                <table>

                    <thead>

                        <tr>
                            <th>ID</th>
                            <th>Producto</th>
                            <th>Descripción</th>
                            <th>Precio unitario</th>
                            <th>Stock</th>
                            <th>Estado</th>
                            <th>Acciones</th>
                        </tr>

                    </thead>


                    <tbody id="tablaProductos">

                        <!--
                            Los productos se cargarán aquí
                            automáticamente desde Oracle.
                        -->

                    </tbody>

                </table>

            </div>

        </div>

    </div>


    <script src="js/sidebar.js"></script>

    <script>
        document.getElementById(
            "sidebar-container"
        ).innerHTML =
            cargarSidebar(
                "productos.html"
            );
    </script>

    <script src="js/productos.js"></script>

</body>

</html>

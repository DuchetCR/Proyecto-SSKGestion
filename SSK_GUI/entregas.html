<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        SSK Gestión — Entregas
    </title>

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css"
    >

    <link
        rel="stylesheet"
        href="css/ssk.css"
    >
</head>

<body>

    <div id="sidebar-container"></div>


    <div class="main">

        <div class="topbar">

            <h2>
                Entregas
            </h2>

           <div class="usuario-info">

            <div class="avatar">
                CM
            </div>

                <div class="usuario-datos">
                    <span>
                        Carlos Mora — Gerente General
                    </span>

                    <a href="login.html" class="btn-cerrar-sesion">
                        <i class="fas fa-sign-out-alt"></i>
                        Cerrar sesión
                    </a>
                </div>

            </div>

        </div>


        <div class="content">

            <!-- Mensajes de éxito o error -->
            <div
                id="mensajeEntrega"
                style="display: none;"
            ></div>


            <!-- Buscar y crear entrega -->
            <div class="barra-busqueda">

                <input
                    id="buscarEntrega"
                    type="text"
                    placeholder="Buscar entrega..."
                >

                <button
                    type="button"
                    class="btn btn-primary"
                    onclick="mostrarFormularioEntrega()"
                >
                    <i class="fas fa-plus"></i>
                    Nueva entrega
                </button>

            </div>


            <!-- Formulario -->
            <div
                id="formularioEntrega"
                style="
                    display: none;
                    margin-bottom: 24px;
                "
            >

                <div class="form-card">

                    <h3 id="tituloFormularioEntrega">
                        Nueva entrega
                    </h3>


                    <form id="formEntrega">

                        <div class="form-row">

                            <div class="form-group">

                                <label for="pedidoEntrega">
                                    Pedido
                                </label>

                                <select
                                    id="pedidoEntrega"
                                    required
                                >
                                    <option value="">
                                        Cargando pedidos...
                                    </option>
                                </select>

                            </div>


                            <div class="form-group">

                                <label for="repartidorEntrega">
                                    Repartidor
                                </label>

                                <select
                                    id="repartidorEntrega"
                                    required
                                >
                                    <option value="">
                                        Cargando repartidores...
                                    </option>
                                </select>

                            </div>

                        </div>


                        <!-- Información automática -->
                        <div
                            style="
                                margin-bottom: 20px;
                                padding: 15px;
                                background: #f7f7f7;
                                border-radius: 6px;
                            "
                        >

                            <div
                                style="
                                    margin-bottom: 8px;
                                "
                            >
                                <strong>
                                    Cliente:
                                </strong>

                                <span id="clienteEntrega">
                                    —
                                </span>
                            </div>


                            <div
                                style="
                                    margin-bottom: 8px;
                                "
                            >
                                <strong>
                                    Producto:
                                </strong>

                                <span id="productoEntrega">
                                    —
                                </span>
                            </div>


                            <div>
                                <strong>
                                    Dirección:
                                </strong>

                                <span id="direccionEntrega">
                                    —
                                </span>
                            </div>

                        </div>


                        <div class="form-row">

                            <div class="form-group">

                                <label for="fechaEntrega">
                                    Fecha de entrega
                                </label>

                                <input
                                    id="fechaEntrega"
                                    type="date"
                                    required
                                >

                            </div>


                            <div class="form-group">

                                <label for="estadoEntrega">
                                    Estado
                                </label>

                                <select
                                    id="estadoEntrega"
                                    required
                                >
                                    <option value="3">
                                        Pendiente
                                    </option>

                                    <option value="4">
                                        Cancelado
                                    </option>

                                    <option value="5">
                                        Completado
                                    </option>
                                </select>

                            </div>

                        </div>


                        <div class="form-actions">

                            <button
                                id="btnGuardarEntrega"
                                type="submit"
                                class="btn btn-primary"
                            >
                                <i class="fas fa-save"></i>
                                Guardar entrega
                            </button>


                            <button
                                type="button"
                                class="btn btn-outline"
                                onclick="ocultarFormularioEntrega()"
                            >
                                Cancelar
                            </button>

                        </div>

                    </form>

                </div>

            </div>


            <!-- Tabla -->
            <div class="tabla-card">

                <div class="tabla-header">

                    <h3>
                        Lista de entregas
                    </h3>

                </div>


                <table>

                    <thead>

                        <tr>
                            <th>ID</th>
                            <th>Pedido</th>
                            <th>Cliente</th>
                            <th>Producto</th>
                            <th>Repartidor</th>
                            <th>Dirección</th>
                            <th>Fecha entrega</th>
                            <th>Estado</th>
                            <th>Acciones</th>
                        </tr>

                    </thead>


                    <tbody id="tablaEntregas">

                        <tr>
                            <td colspan="9">
                                Cargando entregas...
                            </td>
                        </tr>

                    </tbody>

                </table>

            </div>

        </div>

    </div>


    <script src="js/sidebar.js"></script>

    <script>
        document.getElementById(
            "sidebar-container"
        ).innerHTML =
            cargarSidebar(
                "entregas.html"
            );
    </script>

    <script src="js/entregas.js"></script>

</body>

</html>

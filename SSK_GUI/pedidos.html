<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        SSK Gestión — Pedidos
    </title>

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css"
    >

    <link
        rel="stylesheet"
        href="css/ssk.css"
    >
</head>

<body>

    <div id="sidebar-container"></div>


    <div class="main">

        <div class="topbar">

            <h2>
                Pedidos
            </h2>

            <div class="usuario-info">

                <div class="avatar">
                    CM
                </div>

                <span>
                    Carlos Mora — Gerente General
                </span>

            </div>

        </div>


        <div class="content">

            <!-- Mensajes -->
            <div
                id="mensajePedido"
                style="display: none;"
            ></div>


            <!-- Buscar y nuevo pedido -->
            <div class="barra-busqueda">

                <input
                    id="buscarPedido"
                    type="text"
                    placeholder="Buscar pedido..."
                >

                <button
                    type="button"
                    class="btn btn-primary"
                    onclick="mostrarFormularioPedido()"
                >
                    <i class="fas fa-plus"></i>
                    Nuevo pedido
                </button>

            </div>


            <!-- Formulario -->
            <div
                id="formularioPedido"
                style="
                    display: none;
                    margin-bottom: 24px;
                "
            >

                <div class="form-card">

                    <h3 id="tituloFormularioPedido">
                        Nuevo pedido
                    </h3>


                    <form id="formPedido">

                        <div class="form-row">

                            <div class="form-group">

                                <label for="clientePedido">
                                    Cliente
                                </label>

                                <select
                                    id="clientePedido"
                                    required
                                >
                                    <option value="">
                                        Cargando clientes...
                                    </option>
                                </select>

                            </div>


                            <div class="form-group">

                                <label for="productoPedido">
                                    Producto
                                </label>

                                <select
                                    id="productoPedido"
                                    required
                                >
                                    <option value="">
                                        Cargando productos...
                                    </option>
                                </select>

                            </div>

                        </div>


                        <div
                            style="
                                display: flex;
                                gap: 24px;
                                margin-bottom: 18px;
                                padding: 12px;
                                background: #f7f7f7;
                                border-radius: 6px;
                            "
                        >

                            <div>
                                <strong>
                                    Precio unitario:
                                </strong>

                                <span id="precioProductoPedido">
                                    ₡0
                                </span>
                            </div>


                            <div>
                                <strong>
                                    Existencias:
                                </strong>

                                <span id="existenciasProductoPedido">
                                    0
                                </span>
                            </div>

                        </div>


                        <div class="form-row">

                            <div class="form-group">

                                <label for="cantidadPedido">
                                    Cantidad
                                </label>

                                <input
                                    id="cantidadPedido"
                                    type="number"
                                    min="1"
                                    step="1"
                                    required
                                    placeholder="Ej: 10"
                                >

                            </div>


                            <div class="form-group">

                                <label for="fechaPedido">
                                    Fecha del pedido
                                </label>

                                <input
                                    id="fechaPedido"
                                    type="date"
                                    required
                                >

                            </div>

                        </div>


                        <div class="form-row">

                            <div class="form-group">

                                <label for="estadoPedido">
                                    Estado
                                </label>

                                <select
                                    id="estadoPedido"
                                    required
                                >
                                    <option value="3">
                                        Pendiente
                                    </option>

                                    <option value="4">
                                        Cancelado
                                    </option>

                                    <option value="5">
                                        Completado
                                    </option>
                                </select>

                            </div>

                        </div>


                        <div class="form-actions">

                            <button
                                id="btnGuardarPedido"
                                type="submit"
                                class="btn btn-primary"
                            >
                                <i class="fas fa-save"></i>
                                Guardar pedido
                            </button>


                            <button
                                type="button"
                                class="btn btn-outline"
                                onclick="ocultarFormularioPedido()"
                            >
                                Cancelar
                            </button>

                        </div>

                    </form>

                </div>

            </div>


            <!-- Tabla -->
            <div class="tabla-card">

                <div class="tabla-header">

                    <h3>
                        Lista de pedidos
                    </h3>

                </div>


                <table>

                    <thead>

                        <tr>
                            <th>ID</th>
                            <th>Cliente</th>
                            <th>Producto</th>
                            <th>Cantidad</th>
                            <th>Precio unit.</th>
                            <th>Fecha</th>
                            <th>Estado</th>
                            <th>Acciones</th>
                        </tr>

                    </thead>


                    <tbody id="tablaPedidos">

                        <tr>
                            <td colspan="8">
                                Cargando pedidos...
                            </td>
                        </tr>

                    </tbody>

                </table>

            </div>

        </div>

    </div>


    <script src="js/sidebar.js"></script>

    <script>
        document.getElementById(
            "sidebar-container"
        ).innerHTML =
            cargarSidebar(
                "pedidos.html"
            );
    </script>

    <script src="js/pedidos.js"></script>

</body>

</html>

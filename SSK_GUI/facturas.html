<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        SSK Gestión — Facturas
    </title>

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css"
    >

    <link
        rel="stylesheet"
        href="css/ssk.css"
    >
</head>

<body>

    <div id="sidebar-container"></div>


    <div class="main">

        <div class="topbar">

            <h2>
                Facturas
            </h2>

            <div class="usuario-info">

                <div class="avatar">
                    CM
                </div>

                <div class="usuario-datos">
                    <span>
                        Carlos Mora — Gerente General
                    </span>

                    <a href="login.html" class="btn-cerrar-sesion">
                        <i class="fas fa-sign-out-alt"></i>
                        Cerrar sesión
                    </a>
                </div>

            </div>

        </div>


        <div class="content">

            <!-- Mensajes -->
            <div
                id="mensajeFactura"
                style="display: none;"
            ></div>


            <!-- Resumen -->
            <div
                class="cards-resumen"
                style="
                    grid-template-columns:
                        repeat(3, 1fr);
                    margin-bottom: 24px;
                "
            >

                <div class="card-r">

                    <div class="icono-card verde">

                        <i class="fas fa-money-bill-wave"></i>

                    </div>

                    <div class="dato">

                        <h3 id="totalFacturado">
                            ₡0
                        </h3>

                        <p>
                            Total facturado
                        </p>

                    </div>

                </div>


                <div class="card-r">

                    <div class="icono-card azul">

                        <i class="fas fa-check-circle"></i>

                    </div>

                    <div class="dato">

                        <h3 id="facturasCompletadas">
                            0
                        </h3>

                        <p>
                            Completadas
                        </p>

                    </div>

                </div>


                <div class="card-r">

                    <div class="icono-card naranja">

                        <i class="fas fa-clock"></i>

                    </div>

                    <div class="dato">

                        <h3 id="facturasPendientes">
                            0
                        </h3>

                        <p>
                            Pendientes
                        </p>

                    </div>

                </div>

            </div>


            <!-- Buscar y nueva factura -->
            <div class="barra-busqueda">

                <input
                    id="buscarFactura"
                    type="text"
                    placeholder="Buscar factura..."
                >

                <button
                    type="button"
                    class="btn btn-primary"
                    onclick="mostrarFormularioFactura()"
                >
                    <i class="fas fa-plus"></i>
                    Nueva factura
                </button>

            </div>


            <!-- Formulario -->
            <div
                id="formularioFactura"
                style="
                    display: none;
                    margin-bottom: 24px;
                "
            >

                <div class="form-card">

                    <h3 id="tituloFormularioFactura">
                        Nueva factura
                    </h3>


                    <form id="formFactura">

                        <div class="form-row">

                            <div class="form-group">

                                <label for="pagoFactura">
                                    Pago y pedido
                                </label>

                                <select
                                    id="pagoFactura"
                                    required
                                >
                                    <option value="">
                                        Cargando pagos...
                                    </option>
                                </select>

                            </div>

                        </div>


                        <!-- Información automática -->
                        <div
                            style="
                                margin-bottom: 20px;
                                padding: 15px;
                                background: #f7f7f7;
                                border-radius: 6px;
                            "
                        >

                            <div style="margin-bottom: 8px;">

                                <strong>
                                    Cliente:
                                </strong>

                                <span id="clienteFactura">
                                    —
                                </span>

                            </div>


                            <div style="margin-bottom: 8px;">

                                <strong>
                                    Producto:
                                </strong>

                                <span id="productoFactura">
                                    —
                                </span>

                            </div>


                            <div style="margin-bottom: 8px;">

                                <strong>
                                    Método de pago:
                                </strong>

                                <span id="metodoFactura">
                                    —
                                </span>

                            </div>


                            <div>

                                <strong>
                                    Monto pagado:
                                </strong>

                                <span id="montoPagoFactura">
                                    ₡0
                                </span>

                            </div>

                        </div>


                        <div class="form-row">

                            <div class="form-group">

                                <label for="fechaFactura">
                                    Fecha de factura
                                </label>

                                <input
                                    id="fechaFactura"
                                    type="date"
                                    required
                                >

                            </div>


                            <div class="form-group">

                                <label for="totalFactura">
                                    Total (₡)
                                </label>

                                <input
                                    id="totalFactura"
                                    type="number"
                                    min="0.01"
                                    step="0.01"
                                    required
                                    placeholder="Ej: 85000"
                                >

                            </div>

                        </div>


                        <div class="form-row">

                            <div class="form-group">

                                <label for="estadoFactura">
                                    Estado
                                </label>

                                <select
                                    id="estadoFactura"
                                    required
                                >
                                    <option value="3">
                                        Pendiente
                                    </option>

                                    <option value="4">
                                        Cancelado
                                    </option>

                                    <option
                                        value="5"
                                        selected
                                    >
                                        Completado
                                    </option>
                                </select>

                            </div>

                        </div>


                        <div class="form-actions">

                            <button
                                id="btnGuardarFactura"
                                type="submit"
                                class="btn btn-primary"
                            >
                                <i class="fas fa-save"></i>
                                Guardar factura
                            </button>


                            <button
                                type="button"
                                class="btn btn-outline"
                                onclick="ocultarFormularioFactura()"
                            >
                                Cancelar
                            </button>

                        </div>

                    </form>

                </div>

            </div>


            <!-- Tabla -->
            <div class="tabla-card">

                <div class="tabla-header">

                    <h3>
                        Historial de facturas
                    </h3>

                </div>


                <table>

                    <thead>

                        <tr>
                            <th>ID factura</th>
                            <th>Pedido</th>
                            <th>Pago</th>
                            <th>Cliente</th>
                            <th>Producto</th>
                            <th>Fecha</th>
                            <th>Total</th>
                            <th>Estado</th>
                            <th>Acciones</th>
                        </tr>

                    </thead>


                    <tbody id="tablaFacturas">

                        <tr>
                            <td colspan="9">
                                Cargando facturas...
                            </td>
                        </tr>

                    </tbody>

                </table>

            </div>

        </div>

    </div>


    <script src="js/sidebar.js"></script>

    <script>
        document.getElementById(
            "sidebar-container"
        ).innerHTML =
            cargarSidebar(
                "facturas.html"
            );
    </script>

    <script src="js/facturas.js"></script>

</body>

</html>
